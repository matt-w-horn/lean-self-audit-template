name: ci

on:
  push:
    branches: [main]
  # labeled/unlabeled are included so applying silencing-signed-off to an
  # already-open PR re-evaluates the guard job's skip condition — the
  # default event types only carry the labels present at open or push.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI mirror of the pre-commit silencing-guard: a PR diff that adds a
  # gate-silencing token, touches a linter line in lakefile.toml, or edits
  # a gate carrier fails here even if the local hook was bypassed. No Lean
  # needed. The CI sign-off is the silencing-signed-off label on the PR —
  # the visible equivalent of the local SKIP=silencing-guard.
  silencing-guard:
    name: silencing-guard
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'silencing-signed-off')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: guard the PR diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: make silencing-guard GUARD_DIFF="$BASE...HEAD"

  build:
    name: lake build
    # A label toggle should re-run the cheap guard job above, not this
    # full build; skipped counts as success for required checks.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the library with the pinned toolchain; restores the Mathlib
      # olean cache automatically. Template/AxiomAudit.lean is part of the
      # default target, so a `sorry` or stray axiom in any NAMED declaration
      # fails this job — and --wfail turns every syntax-linter warning
      # (the lakefile's mathlibStandardSet and core linters) into a failure.
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
      # The test driver (TemplateTest/Main.lean). Building it elaborates the
      # compile-time gates (axiom audit, coverage report); running it checks
      # the statement lock, the import roots, the negative fixtures, the
      # scanner corpus, and the prose-sync suite.
      - name: kernel-tier gates (lake test; the review-tier claims stage runs inside it, advisory)
        run: lake test
      # Batteries' environment linters (simp normal form, unused arguments,
      # missing docstrings, explicit iff variables, ...) over every
      # declaration in the library.
      - name: lint
        run: lake lint
      # Mathlib's text-based linters (unicode allowlist, trailing
      # whitespace, ...) over the default target's sources. Exceptions
      # would live in scripts/nolints-style.txt, which stays empty.
      - name: lint-style
        run: lake exe lint-style
      # The Python tooling's own tests: the rename tool's word-boundary
      # behavior and the claims writer's note validation.
      - name: tool tests
        run: python3 -m unittest discover -s tools/tests

  # Layers 2 and 3 of the self-test: the template must instantiate under
  # a different name with every gate still green, and the instantiated
  # gates must REJECT an injected sorry, a doctored lock line, and a
  # docstring edit under a recorded verdict. tools/selftest.sh.
  instantiation:
    name: self-test layers 2-3 (rename + gates bite)
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
      - name: rename, rebuild, inject, assert rejection
        run: bash tools/selftest.sh
